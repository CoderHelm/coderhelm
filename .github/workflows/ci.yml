name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The dashboard's UI rules (model names, brand spelling, jargon, labels).
      # Needs only TypeScript, which the root install has.
      - name: Dashboard UI lint
        run: node dashboard/scripts/ui-lint.mjs
      - run: npm run build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      E2E_PORT: "3111"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: UI lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      # The e2e suite runs against this build, so it points the API at the
      # local server the specs mock.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3111
          NEXT_PUBLIC_STREAM_URL: http://localhost:3111
      - name: Install Playwright's Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_STATIC: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: dashboard/test-results/
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      E2E_PORT: "3460"
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from this repo's merged pull requests.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      # The route extractor and the plugin validator.
      - name: Unit tests
        run: npm run test:unit
      # Imports the self-hosting guides, routes and changelog from the
      # coderhelm-platform commit pinned in docs/platform.lock.json.
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: No broken internal links
        run: npm run check:links
      - name: llms.txt, Markdown twins, sitemap and Open Graph images
        run: npm run check:output
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-playwright-results
          path: docs/test-results/
          retention-days: 7

  selfhost-dashboard:
    name: Dashboard (self-host build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      E2E_PORT: "3112"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # The build a self-host release ships: no API URL baked in. Where the
      # API is comes from runtime-config.js, which each install writes.
      - name: Build without an API URL
        run: |
          npm run build
          test -f out/runtime-config.js
          grep -q 'src="/runtime-config.js"' out/index.html
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Self-host checks
        run: npx playwright test e2e/selfhost.spec.ts
        env:
          E2E_STATIC: "1"

  infra:
    name: Infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Deploy-safety checks on the synthesized stacks (test/static-site.test.ts).
      - run: npm test
