# yaml-language-server: $schema=https://docs.coderhelm.com/schema/plugin-manifest.v1.json
name: marketing
version: 1.0.0
description: Drafts launch posts, emails and blog updates from each release, in your brand voice, for an editor to approve.

skills:
  - skills/*/SKILL.md
agents:
  - agents/*.md

settings:
  - key: brand_voice_doc
    type: text
    label: Brand voice
    description: Paste your voice and tone guide. The launch writer follows it in every draft.
    required: true
  - key: banned_claims
    type: text
    label: Claims we never make
    description: One per line, for example "fastest" or "guaranteed".
  - key: sanity
    type: connection
    provider: mcp
    label: Sanity
    description: The CMS where blog drafts are saved. Connect it on the Connections page first.
  - key: linkedin
    type: connection
    provider: oauth2
    scopes: [w_member_social]
    label: LinkedIn
    description: The company page posts are published to.
  - key: linkedin_org
    type: string
    label: LinkedIn organization id
    description: The number at the end of your company page's admin URL.
    required: true

tools:
  - ref: mcp:sanity
    allow: [get_document, query_documents, create_draft]
    risk: write
  - name: publish_post
    kind: http
    description: Publish an approved post to the company's LinkedIn page.
    risk: consequential
    request:
      method: POST
      url: https://api.linkedin.com/rest/posts
      connection: linkedin
      headers:
        LinkedIn-Version: "202409"
      body:
        author: "urn:li:organization:{settings.linkedin_org}"
        commentary: "{text}"
        visibility: PUBLIC
        lifecycleState: PUBLISHED
        distribution:
          feedDistribution: MAIN_FEED
    inputs:
      text:
        type: string
        description: The approved post text.
        example: We just shipped faster code reviews.

triggers:
  - on: github.release
  - on: schedule
    cron: "0 14 * * MON"
    timezone: America/New_York
  - on: manual
    form:
      brief: text
      channels: [linkedin, blog, email]

outputs:
  - type: draft
    kinds: [blog, social, email]
  - type: publish
    via: publish_post
    approval:
      role: marketing_editor
      min: 1

budget:
  monthly_tokens: 2000000
